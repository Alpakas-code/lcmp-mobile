- assertVisible:
    id: student-schedule-screen
- tapOn:
    id: student-exams-tab
- assertVisible:
    id: student-exams-screen
- tapOn:
    id: student-more-tab
- tapOn: Attendance
- assertVisible:
    id: student-attendance-screen
